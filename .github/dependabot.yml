# Weekly pull requests for the commit pins of the workflow actions and for the
# Go modules. Nothing merges on its own: CI (tests on every OS, govulncheck)
# runs on each pull request and a person merges it. A module bump that raises
# the go directive is visible in the go.mod diff of its pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
