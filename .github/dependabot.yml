# Keeps the commit pins of the workflow actions current. Go modules are left
# out on purpose: several are pinned for the go 1.22 directive (bumping them is
# a deliberate change, never an automatic one).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
