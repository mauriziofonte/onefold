# Tests on Linux and Windows-native (the primary target). Also called by the
# release workflow before anything is built. Actions are pinned by commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # this repository can live on other forges reading .github/workflows:
    # run only on GitHub (and under act, which reports a github.com server)
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3" # toolchain pin (workstations too); go.mod holds the language directive
          cache: false

      - name: external tools (Linux)
        if: runner.os == 'Linux'
        # the end-to-end test needs exiftool, ffmpeg and ffprobe: without them it skips, and a skip is not a pass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libimage-exiftool-perl ffmpeg poppler-utils p7zip-full antiword

      - name: external tools (Windows, pinned downloads of onefold itself)
        if: runner.os == 'Windows'
        env:
          ONEFOLD_STATE_DIR: ${{ runner.temp }}\onefold-state
        run: |
          go run ./cmd/onefold tools install all
          printf '%s\\tools\n' "$ONEFOLD_STATE_DIR" >> "$GITHUB_PATH"

      - name: format
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: vet (both targets, whatever the runner)
        run: |
          GOOS=linux go vet ./...
          GOOS=windows go vet ./...

      - name: test
        run: go test -count=1 ./...

      - name: end-to-end ran (not skipped)
        run: |
          go test -count=1 -run 'TestE2E$' -v ./cmd/onefold | tee e2e.log
          grep -q -- '--- PASS[:] TestE2E' e2e.log

  vulncheck:
    name: govulncheck
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: govulncheck (pinned version, module checksum verified by sum.golang.org)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
