# OpenSSF Scorecard: the supply-chain checks of the repository (pinned
# actions, branch protection, token permissions, signed releases...), on
# every push to main and weekly. The results go to code scanning and to
# scorecard.dev, which serves the README badge. Publishing requires this
# workflow to stay plain: no top-level env or defaults, only the actions
# below, a GitHub-hosted Ubuntu runner.
name: scorecard

on: # zizmor: ignore[concurrency-limits] kept plain for scorecard.dev publishing; weekly, overlapping runs are harmless
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 1" # Mondays 05:29 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: scorecard
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest # the publishing check of scorecard.dev accepts GitHub-hosted Ubuntu labels
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read workflow runs for the CI and token-permission checks
      security-events: write # results to code scanning
      id-token: write # results to scorecard.dev (the badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
