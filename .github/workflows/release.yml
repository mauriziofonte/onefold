# Release: pushing a version tag v<VERSION> (SemVer: vMAJOR.MINOR.PATCH, or a
# pre-release such as v0.0.1-alpha) on a commit of main runs the CI tests
# (Linux, Windows, macOS arm64 and Intel), builds every artifact with
# `make release` (binaries, onefold.app zips, .deb/.rpm/.apk), builds it all
# again from a second checkout in another folder and requires the same bytes,
# checks the artifacts, signs the Windows exe through SignPath when the
# repository is set up for it (vars and secret below; skipped otherwise),
# writes a CycloneDX SBOM per binary and the package-manager manifests,
# attests the build provenance of every asset and publishes the GitHub
# release of that tag (a pre-release when the version has a suffix), with
# the notes of its CHANGELOG.md section.
# Actions are pinned by commit; publishing uses the gh CLI of the runner.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: v2.48.0 # Linux packages (packaging/nfpm.yaml)
  CYCLONEDX_GOMOD_VERSION: v1.12.0 # SBOMs

jobs:
  test:
    name: tests
    uses: $/.github/workflows/ci.yml # self-repository form: pinned to this commit
    permissions:
      contents: read

  build:
    name: build and check
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      exe-artifact-id: ${{ steps.exe.outputs.artifact-id }}
    env:
      CGO_ENABLED: "0"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and main, for the checks below
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false # a release never restores a cache

      - name: the tag names a commit of main and the version of VERSION and CHANGELOG.md
        run: |
          test "$(git describe --tags --exact-match)" = "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$TAG" = "v$(cat VERSION)" || { echo "tag $TAG, VERSION says v$(cat VERSION)"; exit 1; }
          grep -qF "## [$(cat VERSION)]" CHANGELOG.md || { echo "CHANGELOG.md has no section [$(cat VERSION)]"; exit 1; }

      - name: modules match go.sum
        run: |
          go mod download
          go mod verify

      - name: nfpm (pinned, module checksum verified by sum.golang.org)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: build
        run: make release DIST=out

      - name: check the artifacts
        run: |
          git diff --quiet || { echo "the build changed tracked files"; git status --short; exit 1; }
          cd out
          sha256sum -c SHA256SUMS
          test "$(./onefold-linux-amd64 version | cut -d' ' -f2)" = "$TAG"
          for f in onefold-linux-amd64 onefold-linux-arm64 onefold-windows-amd64.exe onefold-darwin-arm64 onefold-darwin-amd64; do
            go version -m "$f" | grep -qF -- "-X main.version=$TAG\"" || { echo "$f: not built as $TAG"; exit 1; }
          done
          for a in arm64 amd64; do
            unzip -l "onefold-darwin-$a-app.zip" | grep -q ' onefold.app/Contents/MacOS/onefold$'
            unzip -p "onefold-darwin-$a-app.zip" onefold.app/Contents/MacOS/onefold | cmp - "onefold-darwin-$a"
            unzip -p "onefold-darwin-$a-app.zip" onefold.app/Contents/Info.plist | grep -qF "<string>onefold $TAG</string>"
          done
          # every third-party section carries its license text
          awk '/^=== /{if (name && n < 3) bad = bad name "\n"; name = $0; n = 0; next} {n++}
               END {if (n < 3) bad = bad name "\n"; if (bad) {printf "empty notice sections:\n%s", bad; exit 1}}' THIRD_PARTY_NOTICES.txt

      - name: the Linux packages install and hold the binary, the menu entry and the icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm desktop-file-utils
          sudo dpkg -i out/onefold-linux-amd64.deb
          test "$(onefold version | cut -d' ' -f2)" = "$TAG"
          desktop-file-validate /usr/share/applications/onefold.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/onefold.svg
          sudo dpkg -r onefold
          for a in amd64 arm64; do
            dpkg-deb -c "out/onefold-linux-$a.deb" | grep -q ' ./usr/bin/onefold$'
            rpm -qp --queryformat '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "out/onefold-linux-$a.rpm"
            rpm -qpl "out/onefold-linux-$a.rpm" | grep -qx /usr/bin/onefold
            tar -tzif "out/onefold-linux-$a.apk" | grep -qx usr/bin/onefold
          done

      - name: the build is reproducible (a second checkout in another folder builds the same bytes)
        run: |
          git clone -q --no-local . "$RUNNER_TEMP/again"
          git -C "$RUNNER_TEMP/again" checkout -q "$GITHUB_SHA"
          make -C "$RUNNER_TEMP/again" release DIST="$RUNNER_TEMP/again-out"
          diff out/SHA256SUMS "$RUNNER_TEMP/again-out/SHA256SUMS" || { echo "two builds of $TAG differ"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: the Windows exe alone, for signing
        id: exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe-unsigned
          path: out/onefold-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign the Windows exe (SignPath)
    needs: build
    # set up only when the repository has the SignPath variables (Settings >
    # Secrets and variables > Actions): SIGNPATH_ORGANIZATION_ID,
    # SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG, and the secret
    # SIGNPATH_API_TOKEN; packaging/README.md has the steps
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # SignPath fetches the artifact of this run
    steps:
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.exe-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: the signature is there and the exe is still onefold
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends osslsigncode
          osslsigncode verify -in signed/onefold-windows-amd64.exe | tee verify.txt
          grep -q 'Signature verification: ok' verify.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe-signed
          path: signed/onefold-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [build, sign]
    # the sign job is skipped when SignPath is not set up: publish the
    # unsigned exe then, but never after a failed signing
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # provenance attestations (Sigstore)
      attestations: write # store the provenance attestations
    env:
      CGO_ENABLED: "0"
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ needs.sign.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SIGNED == 'true'
        with:
          name: windows-exe-signed
          path: signed

      - name: the signed exe replaces the unsigned one
        if: env.SIGNED == 'true'
        run: |
          (cd out && sha256sum -c SHA256SUMS)
          cp signed/onefold-windows-amd64.exe out/onefold-windows-amd64.exe

      - name: a CycloneDX SBOM per binary
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$CYCLONEDX_GOMOD_VERSION"
          cd out
          for f in onefold-linux-amd64 onefold-linux-arm64 onefold-windows-amd64.exe onefold-darwin-arm64 onefold-darwin-amd64; do
            chmod +x "$f"
            "$RUNNER_TEMP/bin/cyclonedx-gomod" bin -json -licenses -version "$TAG" -output "$f.cdx.json" "$f"
          done

      - name: checksums of every asset
        run: |
          cd out
          sha256sum onefold-* LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Homebrew, Scoop and winget manifests (submitted by hand, packaging/README.md)
        run: go run internal/pack/gen_manifests.go -tag "$TAG" -date "$(date -u +%F)" -sums out/SHA256SUMS -o manifests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: manifests/
          if-no-files-found: error
          retention-days: 90

      - name: provenance of every asset (gh attestation verify FILE --repo OWNER/onefold)
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS

      - name: release notes
        run: |
          {
            echo "onefold $TAG"
            echo
            # this version's CHANGELOG.md section, without its heading
            awk -v v="## [${TAG#v}]" 'index($0, v) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md
            echo
            if [ "$SIGNED" = true ]; then
              echo "- Windows: \`onefold-windows-amd64.exe\`, signed (double-click opens the GUI; optional tools: \`onefold tools install all\` or the Doctor page)."
            else
              echo "- Windows: \`onefold-windows-amd64.exe\` (double-click opens the GUI; optional tools: \`onefold tools install all\` or the Doctor page)."
            fi
            echo "- Linux: \`onefold-linux-amd64\`, \`onefold-linux-arm64\` (static, no dependencies); packages with a menu entry: \`.deb\`, \`.rpm\`, \`.apk\` (the apk is not signed: \`apk add --allow-untrusted\`)."
            echo "- macOS: \`onefold-darwin-arm64\` (Apple Silicon), \`onefold-darwin-amd64\` (Intel), and \`onefold.app\` in \`onefold-darwin-arm64-app.zip\` and \`onefold-darwin-amd64-app.zip\`; not notarized, see the README (Install) for the first start."
            echo "- Checksums: \`sha256sum -c SHA256SUMS\`. Provenance: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`. SBOMs (CycloneDX): \`<binary>.cdx.json\`."
            echo "- License: AGPL-3.0-or-later (\`LICENSE\`); third-party components: \`THIRD_PARTY_NOTICES.txt\`."
          } > notes.md
          (cd out && sha256sum -c SHA256SUMS)

      - name: publish
        if: ${{ !env.ACT }} # act (local test runs) stops here
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" out/* --repo "$REPO" --title "onefold $TAG" --notes-file notes.md --verify-tag "${pre[@]}"

      - name: what would be published (act)
        if: ${{ env.ACT }}
        run: |
          ls -l out manifests
          cat notes.md
