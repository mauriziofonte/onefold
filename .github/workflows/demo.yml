# Renders the README demo GIFs on made-up sandboxes and commits them to the
# branch it runs on: the CLI with vhs (scripts/tapes/render.sh, Linux) and the
# GUI with Playwright screenshots on Windows and macOS (scripts/gui-demo.sh),
# assembled with ffmpeg on Linux (scripts/gif-from-frames.sh). Runs on a push
# to a branch other than main that changes a demo, or by hand (Actions > demo
# > Run workflow, or `gh workflow run demo.yml --ref BRANCH`); never on main:
# the GIFs reach main through a reviewed pull request. Its own commit, made
# with the workflow token, does not start workflows again.
# Actions are pinned by commit.
name: demo

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/tapes/**"
      - "scripts/gui-demo.sh"
      - "scripts/gif-from-frames.sh"
      - "internal/gui/web/demo/**"
      - "internal/gui/web/playwright.demo.config.js"
      - ".github/workflows/demo.yml"

permissions: {}

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI GIFs (vhs)
    if: github.server_url == 'https://github.com' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: exiftool and ffmpeg (sandbox pictures, stamping)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libimage-exiftool-perl ffmpeg

      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
          install-fonts: true

      - name: render
        run: scripts/tapes/render.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-cli
          path: assets/demo/cli-*.gif
          if-no-files-found: error
          retention-days: 7

  gui:
    name: GUI frames (${{ matrix.name }})
    if: github.server_url == 'https://github.com' && github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, name: windows }
          - { os: macos-15, name: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Playwright and its Chromium
        working-directory: internal/gui/web
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: record (screenshots of the real binary)
        env:
          FRAMES_ONLY: "1"
          DEMO_OUT: ${{ runner.temp }}/demo
          # a short, readable path in the GIF: the home folder of the runner
          DEMO_ROOT_NAME: onefold-demo
        run: |
          export DEMO_ROOT="$HOME/$DEMO_ROOT_NAME"
          if command -v cygpath >/dev/null; then DEMO_ROOT="$(cygpath -w "$DEMO_ROOT")"; fi
          scripts/gui-demo.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gui-${{ matrix.name }}
          path: ${{ runner.temp }}/demo/frames
          if-no-files-found: error
          retention-days: 7

  commit:
    name: commit the GIFs to this branch
    needs: [cli, gui]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # commit the rendered GIFs to this branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/demo
          pattern: demo-*

      - name: assemble
        env:
          DEMO: ${{ runner.temp }}/demo
        run: |
          cp "$DEMO"/demo-cli/cli-*.gif assets/demo/
          for os in windows macos; do
            scripts/gif-from-frames.sh "$DEMO/demo-gui-$os" "assets/demo/gui-merge-$os.gif"
          done

      - name: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # the branch may have moved while the GIFs rendered: commit only the
          # GIFs on top of its current tip (the rest of this checkout is left
          # out of the index), retrying if it moves again
          for attempt in 1 2 3; do
            git fetch -q --depth=1 "$url" "refs/heads/${BRANCH}"
            git reset -q --mixed FETCH_HEAD
            git add assets/demo
            if git diff --cached --quiet; then echo "GIFs unchanged"; exit 0; fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "docs: render the demo GIFs"
            if git push -q "$url" "HEAD:refs/heads/${BRANCH}"; then exit 0; fi
            echo "push attempt $attempt rejected, retrying"
            sleep $((attempt * 5))
          done
          exit 1
